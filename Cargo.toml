[package]
name = "erfps2"
version = "0.3.7"
edition = "2024"
authors = ["Dasaav"]
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
eldenring.path = "fromsoftware-rs/crates/eldenring"
eyre = "0.6.12"
fromsoftware-shared.path = "fromsoftware-rs/crates/shared"
glam = "0.33.4"
simplelog = { version = "0.12.2", default-features = false }
libhotpatch = { version = "1.2.0", default-features = false }
log = "0.4.28"
windows = { version = "0.62.2", features = [
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }
diversion = { version = "0.3.3", git = "https://github.com/Dasaav-dsv/diversion.git", features = [
    "custom",
] }
toml = "1.1.4"
serde = { version = "1.0.228", features = ["serde_derive"] }
closure-ffi = { git = "https://github.com/Dasaav-dsv/closure-ffi.git", branch = "refactor/jit-alloc", default-features = false, features = [
    "default_jit_alloc",
    "std",
    "safe_jit",
] }
pelite = "0.10.0"
strum = { version = "0.27.2", features = ["derive"] }
bitvec = "1.0.1"
portable-atomic = { version = "1.13.0", default-features = false, features = [
    "std",
    "float",
] }

[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = true
